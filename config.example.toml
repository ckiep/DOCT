# Скопируйте этот файл в config.toml и заполните.
# config.toml не попадает в git (см. .gitignore), потому что в нём токены.
# Направления здесь не задаются — их добавляют кнопками прямо в боте.

[travelpayouts]
# Бесплатный токен: зарегистрируйтесь на https://www.travelpayouts.com/,
# затем Профиль → API-токен. Можно не писать здесь, а задать TRAVELPAYOUTS_TOKEN.
token = ""
# Валюта цен: kzt, rub, usd, eur...
currency = "kzt"
# Страна Aviasales: kz — ссылки на aviasales.kz
market = "kz"
# Необязательно: ваш партнёрский ID (маркер). С ним ссылки «купить» становятся
# партнёрскими, и с подтверждённых покупок по ним начисляется 1,1–1,3%. Подробнее — в README.
marker = ""

[telegram]
# Токен бота от @BotFather, вида 1234567890:AAH... (или переменная TELEGRAM_BOT_TOKEN).
bot_token = ""
# Ваш ID в Telegram — число, например 123456789 (или TELEGRAM_CHAT_ID).
# Узнать можно у @userinfobot. Это владелец: другие люди получают доступ,
# только когда он нажмёт «Разрешить» в запросе, который придёт от бота.
chat_id = ""
# true — ботом может пользоваться кто угодно без запроса, у каждого свои направления.
public = false

[check]
# Как часто проверять цены.
interval_minutes = 60
# Где хранить направления и историю оповещений (путь относительно этого файла).
state_file = "ticket_alert.db"

# Автопостинг лучших находок в ваш Telegram-канал.
# 1) Добавьте бота в администраторы канала с правом «Публикация сообщений».
# 2) Впишите адрес канала в id. Пусто — автопостинг выключен.
# Владелец может запустить публикацию вручную командой /post в боте.
[channel]
id = ""                    # например "@traveleasy_kz" или числовой ID канала
origins = ["ALA", "NQZ"]   # из каких городов искать билеты
min_discount = 20          # публиковать, только если цена ниже обычной хотя бы на столько %
months_ahead = 2           # на сколько месяцев искать, считая текущий
round_trip = true          # искать и туда-обратно (поездки на 3–14 дней)
max_posts_per_day = 5      # не больше стольких постов за сутки
max_posts_per_run = 2      # и не больше стольких за один раз, чтобы посты шли в течение дня
every_minutes = 180        # как часто искать находки
post_hours = [9, 22]       # публиковать с 9:00 до 22:59 по времени компьютера
sub_id = "channel"         # метка к маркеру: в статистике Travelpayouts видно покупки из канала
